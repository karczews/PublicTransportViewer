name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/run-tests.yml

  lint:
    uses: ./.github/workflows/lint.yml

  build:
    uses: ./.github/workflows/build.yml

  code-quality:
    uses: ./.github/workflows/code-quality.yml

  size-report:
    uses: ./.github/workflows/size-report.yml

  dependency-guard:
    uses: ./.github/workflows/dependency-guard.yml

  dependency-analysis:
    uses: ./.github/workflows/dependency-analysis.yml

  gate:
    # always() so a failed dependency fails the gate instead of skipping it.
    if: always() && github.event_name == 'pull_request'
    needs: [unit-tests, lint, build, code-quality, size-report, dependency-guard, dependency-analysis]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      - run: echo "All checks passed"
