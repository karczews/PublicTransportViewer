name: Room Schema

on:
  workflow_call:

jobs:
  room-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS

      - uses: gradle/actions/setup-gradle@v6

      # Room exports schemas to core/schemas on compile. Fail if the checked-in schemas
      # don't match what the entities generate (e.g. entity changed without committing
      # the new schema, or a stale schema was committed by hand).
      - name: Regenerate Room schemas
        run: ./gradlew :core:assembleDebug -PtomtomApiKey=""

      - name: Check schemas are up to date
        run: |
          if [ -n "$(git status --porcelain -- core/schemas)" ]; then
            echo "::error::Room schemas in core/schemas/ are out of date."
            git status --porcelain -- core/schemas
            echo "Run './gradlew :core:assembleDebug' locally and commit the updated schemas."
            exit 1
          fi
          if [ -z "$(ls core/schemas/com.github.karczews.publictransportviewer.data.db.GtfsDatabase/)" ]; then
            echo "::error::No Room schema files found in core/schemas/."
            exit 1
          fi
