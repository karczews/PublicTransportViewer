name: Size Report

on:
  workflow_call:

jobs:
  size-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew assembleTomtomRelease assembleMaplibreRelease bundleTomtomRelease bundleMaplibreRelease -PtomtomApiKey=""

      - name: Report APK/AAB sizes
        run: |
          {
            echo "## APK/AAB size report"
            echo ""
            echo "| Artifact | Size |"
            echo "| --- | --- |"
            for f in \
              app/build/outputs/apk/tomtom/release/*.apk \
              app/build/outputs/apk/maplibre/release/*.apk \
              app/build/outputs/bundle/tomtomRelease/*.aab \
              app/build/outputs/bundle/maplibreRelease/*.aab; do
              size=$(du -h "$f" | cut -f1)
              echo "| \`$f\` | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/tomtom/release/*.apk
            app/build/outputs/apk/maplibre/release/*.apk
            app/build/outputs/bundle/tomtomRelease/*.aab
            app/build/outputs/bundle/maplibreRelease/*.aab
          retention-days: 14
