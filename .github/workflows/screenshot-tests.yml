name: Screenshot Tests

on:
  workflow_call:
    secrets:
      TOMTOM_API_KEY:
        required: false

jobs:
  screenshot-tests:
    # Pinned to 24.04: the emulator needs host audio libs (libpulse) that newer
    # ubuntu-latest images may lack, which fails qemu boot with a missing
    # libpulse.so.0 error.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS

      - uses: gradle/actions/setup-gradle@v6

      - name: Install emulator host libraries
        # The emulator binary links libpulse at startup (even with -no-audio) and
        # recent runner images don't ship it, failing qemu boot with a missing
        # libpulse.so.0 error.
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      - name: Run screenshot tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: |
            # Fixed status bar (clock/battery/signal) so goldens don't drift.
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1200
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            ./gradlew :map-maplibre:connectedDebugAndroidTest :map-tomtom:connectedDebugAndroidTest -PtomtomApiKey="${{ secrets.TOMTOM_API_KEY }}"
            # Pull failure artifacts (actual/diff PNGs) saved by ScreenshotGolden.
            adb pull /storage/emulated/0/Android/data/com.github.karczews.publictransportviewer.map.maplibre.test/files/screenshots screenshots-device/maplibre || true
            adb pull /storage/emulated/0/Android/data/com.github.karczews.publictransportviewer.map.tomtom.test/files/screenshots screenshots-device/tomtom || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-device-outputs
          path: screenshots-device/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-test-results
          path: |
            */build/outputs/androidTest-results/
            */build/reports/androidTests/
          retention-days: 7
