name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew assembleDebug -PtomtomApiKey=""

      # Room exports schemas to core/schemas on compile (KSP). Fail if the checked-in
      # schemas don't match what the entities generate.
      - name: Check Room schemas are up to date
        run: ./scripts/check-room-schemas.sh

      - name: Upload debug APKs (main, 30d retention)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: apks-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 30

      - name: Upload debug APKs (PR/branch, 3d retention)
        uses: actions/upload-artifact@v7
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        with:
          name: apks-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 3
